{{- $server := include "zenml.serverValues" . | fromYaml -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "zenml.fullname" . }}-test-connection"
  labels:
    {{- include "zenml.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: wget
      image: busybox:1.37
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command: ['wget']
      args: ['-O', '/dev/null', '{{ include "zenml.fullname" . }}:{{ $server.service.port }}']
  restartPolicy: Never
