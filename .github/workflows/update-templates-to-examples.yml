---
name: Auto-update all templates
on:
  workflow_call:
    inputs:
      os:
        description: OS
        type: string
        required: true
      python-version:
        description: Python version
        type: string
        required: true
  workflow_dispatch:
    inputs:
      os:
        description: OS
        type: choice
        options: [ubuntu-latest, macos-13, windows-latest]
        required: false
        default: ubuntu-latest
      python-version:
        description: Python version
        type: choice
        options: ['3.10', '3.11', '3.12', '3.13', '3.14']
        required: false
        default: '3.11'
env:
  ZENML_DEBUG: 1
  ZENML_LOGGING_VERBOSITY: debug
  ZENML_ANALYTICS_OPT_IN: false
jobs:
  update-e2e-batch-template-to-examples:
    name: update-e2e-batch-template-to-examples
    runs-on: ${{ inputs.os }}
    env:
      PYTHONIOENCODING: utf-8
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES'
    if: github.event_name == 'pull_request' && ! startsWith(github.event.head_commit.message,
      'GitBook:')
    defaults:
      run:
        shell: bash
    steps:
      - name: Safeguard macOS certificate trust
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Temporary mitigation for actions/runner-images#15228, before any checkout/download.
          blocked_roots='emSign ECC Root CA - G3|emSign ECC Root CA - C3|emSign Root CA - C1|AAA Certificate Services'
          filtered=$(mktemp)
          trap 'rm -f "$filtered"' EXIT
          test -f /etc/ssl/cert.pem
          for bundle in /etc/ssl/cert.pem /opt/homebrew/etc/ca-certificates/cert.pem /usr/local/etc/ca-certificates/cert.pem; do
            [ -f "$bundle" ] || continue
            openssl crl2pkcs7 -nocrl -certfile "$bundle" |
              openssl pkcs7 -print_certs |
              awk -v blocked="$blocked_roots" '/^subject=/{skip=($0 ~ blocked)} !skip' > "$filtered"
            grep -q -- '-----BEGIN CERTIFICATE-----' "$filtered"
            subjects=$(openssl crl2pkcs7 -nocrl -certfile "$filtered" | openssl pkcs7 -print_certs -noout)
            if grep -Eq "$blocked_roots" <<< "$subjects"; then
              echo "::error::Affected certificate roots remain in $bundle"
              exit 1
            fi
            sudo cp "$filtered" "$bundle"
          done
          # pip/uv/Requests/Git may otherwise use their own, older CA bundles.
          for variable in SSL_CERT_FILE CURL_CA_BUNDLE GIT_SSL_CAINFO PIP_CERT REQUESTS_CA_BUNDLE; do
            export "$variable=/etc/ssl/cert.pem"
            echo "$variable=/etc/ssl/cert.pem" >> "$GITHUB_ENV"
          done
          # Older Intel images can fall back to Apple's trust database even after filtering.
          for client in /usr/bin/curl "$(command -v curl)"; do
            "$client" --fail --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null https://github.com/
            for host in dv-g3b-noct-emudhra.we-have-a-problem.com dv-g3b-aaa-noct-emudhra.we-have-a-problem.com; do
              if "$client" --silent --connect-timeout 10 --max-time 30 --output /dev/null "https://$host/"; then
                echo "::error::$client still trusts a compromised certificate chain ($host)"
                exit 1
              else
                curl_status=$?
                if [ "$curl_status" -ne 60 ]; then
                  echo "::error::Certificate probe failed for a reason other than certificate rejection (curl $curl_status)"
                  exit 1
                fi
              fi
            done
          done
      - name: Run template tests for zenml-io/template-e2e-batch
        uses: zenml-io/template-e2e-batch/.github/actions/e2e_template_test@main
        with:
          python-version: ${{ inputs.python-version }}
          stack-name: local
          ref-zenml: ${{ github.ref }}
          ref-template: 2025.12.17  # Make sure it is aligned with ZENML_PROJECT_TEMPLATES from src/zenml/cli/base.py
      - name: Clean-up
        run: |
          rm -rf ./local_checkout
      - name: message-on-error
        if: failure()
        run: |
          echo "::error title=zenml-io/template-e2e-batch project template testing failed with new version of ZenML core!::\
            Breaking changes affecting templates have been introduced. To mitigate this issue,\
            please make the code in zenml-io/template-e2e-batch compatible with new version of\
            ZenML core, release it and update release tag in zenml.cli.base.ZENML_PROJECT_TEMPLATES"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Check-out fresh E2E template
        run: |
          rm -rf examples/e2e
          mkdir -p examples/e2e
          printf 'info@zenml.io' | zenml init --path examples/e2e --template e2e_batch --template-with-defaults
          pip install yamlfix
          bash scripts/format.sh examples/e2e
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet "origin/${GITHUB_EVENT_PULL_REQUEST_HEAD_REF}"; then
            echo "No active Git changes found."
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "vvv Active Git changes found vvv"
            echo "changes=true" >> $GITHUB_OUTPUT
            git diff "origin/${GITHUB_EVENT_PULL_REQUEST_HEAD_REF}"
          fi
        env:
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - name: Commit and push template
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -am "Auto-update of E2E template"
          git push origin HEAD:${GITHUB_EVENT_PULL_REQUEST_HEAD_REF}
        env:
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - name: Create PR comment
        if: steps.check_changes.outputs.changes == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'E2E template updates in `examples/e2e` have been pushed.'
            })
