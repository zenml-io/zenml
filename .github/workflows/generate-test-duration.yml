---
name: Generate test duration file
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: 0 8 * * 1  # Run every Monday at 8 am
env:
  ZENML_DEBUG: 1
  ZENML_LOGGING_VERBOSITY: debug
  ZENML_ANALYTICS_OPT_IN: false
jobs:
  generate-test-duration-file:
    name: Generate test duration file
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
    env:
      PYTHONIOENCODING: utf-8
      UV_HTTP_TIMEOUT: 600
          # on MAC OS, we need to set this environment variable
          # to fix problems with the fork() calls (see this thread
          # for more information: http://sealiesoftware.com/blog/archive/2017/6/5/Objective-C_and_fork_in_macOS_1013.html)
      OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: develop
      - name: Setup environment
        uses: $/.github/actions/setup_environment
        with:
          python-version: '3.10'
          os: ubuntu-latest
      - name: Generate test duration file
        continue-on-error: true
            # Ubuntu integration tests run as 6 shards
        run: |
          bash scripts/test-coverage-xml.sh "" default "" "" store-durations
      - name: Open a pull request with the new durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- .test_durations)" ]; then
            echo "No changes in .test_durations"
            exit 0
          fi
          # develop only accepts changes through pull requests, so a direct push
          # is rejected. Without this file the CI shards are split by test
          # count instead of duration and finish minutes apart.
          # A fixed branch keeps unmerged weekly refreshes on one pull request.
          branch=ci/update-test-durations
          git checkout -b "$branch"
          git add .test_durations
          git commit -m "Update test duration file"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base develop --head "$branch" \
              --title "Update test duration file" \
              --body "Refreshes .test_durations so the CI test shards stay balanced. Pull requests opened with the default workflow token do not start checks. Remove and re-add the no-release-notes label to run the required label check; the test suites ignore a change to this file alone." \
              --label no-release-notes
          fi
      - name: Verify Python Env unaffected
        run: |-
          zenml integration list
          uv pip list
          uv pip check || true
