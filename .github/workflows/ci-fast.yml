---
name: ci-fast
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '*'
      - '!pyproject.toml'
      - '**.md'
      - .github/workflows/claude.yml
      - .claude/**
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - docs/**
      - '*'
      - '!pyproject.toml'
      - '**.md'
      - .github/workflows/claude.yml
      - .claude/**
concurrency:
  # New commit on branch cancels running workflows of the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  ZENML_DEBUG: true
  ZENML_LOGGING_VERBOSITY: debug
  ZENML_ANALYTICS_OPT_IN: false
jobs:
  sqlite-db-migration-testing-random:
    runs-on: ubuntu-latest
    # if team member commented, not a draft, on a PR, using /fulltest
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'
      - name: Test migrations across versions
        run: bash scripts/test-migrations.sh sqlite random
  spellcheck:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Spelling checker
        uses: crate-ci/typos@4d9c206a77c041268485162b8e2579ad7a5cb9a3  # v1.50.0
        with:
          files: .
          config: ./.typos.toml
  api-docs-test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Test API docs buildable
        run: bash scripts/generate-docs.sh -v DUMMY -c
  update-templates-to-examples:
    # this doesn't work on forked repositories (i.e. outside contributors)
    # so we disable template updates for those PRs / branches
    if: github.event.pull_request.head.repo.full_name == 'zenml-io/zenml' && github.event.pull_request.draft
      == false
    uses: $/.github/workflows/update-templates-to-examples.yml
    with:
      python-version: '3.11'
      os: ubuntu-latest
    secrets: inherit
  linting:
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11']
      fail-fast: false
    uses: $/.github/workflows/linting.yml
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
    secrets: inherit
  ubuntu-setup-and-unit-test:
    needs: linting
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        # IMPORTANT: Since we are using the combination of `arc-runner-set`
        # and `3.10` in our `ci-fast` workflow, this combination has been
        # excluded from the `ci-slow` workflow. If you change the configuration
        # here, please adjust the configuration of `ci-slow` accordingly.
        os: [ubuntu-latest]
        python-version: ['3.11']
      fail-fast: false
    uses: $/.github/workflows/unit-test.yml
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
    secrets: inherit
  ubuntu-latest-integration-test:
    needs: [linting]
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        # IMPORTANT: Since we are using the combination of `arc-runner-set`
        # and `3.10` in our `ci-fast` workflow, this combination has been
        # excluded from the `ci-slow` workflow. If you change the configuration
        # here, please adjust the configuration of `ci-slow` accordingly.
        os: [ubuntu-latest]
        python-version: ['3.11']
        # Dependabot-triggered runs read the (empty) Dependabot secrets store,
        # so the Docker Hub login this environment needs can never succeed.
        # Skip it there instead of burning six jobs per bot PR.
        test_environment: ${{ github.actor == 'dependabot[bot]' && fromJSON('["default"]') || fromJSON('["default", "docker-server-docker-orchestrator-mysql"]') }}
      fail-fast: false
    uses: $/.github/workflows/integration-test-fast.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      test_environment: ${{ matrix.test_environment }}
    secrets: inherit
