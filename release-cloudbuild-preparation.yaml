steps:
  # login to Dockerhub
  - name: gcr.io/cloud-builders/docker
    args:
      - '-c'
      - docker login --username=$$USERNAME --password=$$PASSWORD
    id: docker-login
    entrypoint: bash
    secretEnv:
      - USERNAME
      - PASSWORD

  - name: gcr.io/cloud-builders/docker
    args:
      - '-c'
      - |
        docker run --privileged --rm tonistiigi/binfmt --install arm64
        docker buildx create --name zenml-multiarch --driver docker-container --use
        docker buildx inspect --bootstrap
        docker buildx build . \
          --platform linux/amd64,linux/arm64 \
          --push \
          -f docker/zenml-server-dev.Dockerfile \
          -t $$USERNAME/prepare-release:server-${_ZENML_NEW_VERSION}

    id: build-server
    waitFor:
      - docker-login
    entrypoint: bash
    secretEnv:
      - USERNAME

timeout: 7200s
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/docker-password/versions/1
      env: PASSWORD
    - versionName: projects/$PROJECT_ID/secrets/docker-username/versions/1
      env: USERNAME
