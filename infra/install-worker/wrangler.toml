# Cloudflare Worker serving the one-line installers on zenml.io (worker.mjs).
#
# Deploy, from this directory, with a Cloudflare API token that can edit
# Workers and Workers Routes on the zenml.io zone:
#
#   CLOUDFLARE_API_TOKEN=... npx wrangler@4 deploy
#
# Check it with `curl -fsSL https://zenml.io/install-zenml | head`. If
# zenml.io redirects to www.zenml.io through a Redirect Rule, that rule runs
# before Workers, so the apex route below only takes effect once /install*
# is excluded from it; www.zenml.io works either way.
name = "zenml-install"
main = "worker.mjs"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "zenml.io/install*", zone_name = "zenml.io" },
  { pattern = "www.zenml.io/install*", zone_name = "zenml.io" },
]
